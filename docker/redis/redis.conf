# Redis configuration for the ingestion stream.
#
# Defaults are chosen for a transport that carries network metadata: bound to
# loopback, authenticated, memory-capped, and with the commands that could
# destroy or exfiltrate the stream renamed away.

# ── Network ──────────────────────────────────────────────────────────────────
# 0.0.0.0 here means "every interface *inside this container's namespace*",
# which is not the same statement as on a host.
#
# Docker's published port forwards from the host to the container's bridge
# address, so binding container-loopback would make `127.0.0.1:6379:6379`
# refuse every connection — the proxy never reaches a loopback-only listener.
#
# The exposure control is the host-side binding in docker-compose.yml
# (127.0.0.1:6379, never 6379:6379) plus the ACL below. If you run Redis
# directly on a host instead of in a container, change this to 127.0.0.1.
bind 0.0.0.0
protected-mode yes
port 6379
tcp-keepalive 300
timeout 0

# ── Authentication ───────────────────────────────────────────────────────────
aclfile /etc/redis/users.acl

# ── Memory ───────────────────────────────────────────────────────────────────
# The stream is already bounded by MAXLEN; this is the backstop if a producer
# misbehaves. noeviction makes Redis reject writes rather than silently drop
# stream entries — a refused write is visible, an evicted flow is not.
maxmemory 512mb
maxmemory-policy noeviction

# ── Persistence ──────────────────────────────────────────────────────────────
# AOF everysec: a crash loses at most one second of flows rather than the whole
# backlog. The stream is a transport, not a system of record — platform state
# lives in the memory layer — so this is durability, not archival.
appendonly yes
appendfsync everysec
save 900 1
dir /data

# ── Command hardening ────────────────────────────────────────────────────────
# Renamed to empty = removed. An attacker reaching Redis should not be able to
# wipe the backlog, enumerate keys, or rewrite the running configuration.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command KEYS ""
rename-command CONFIG ""
rename-command DEBUG ""
rename-command SHUTDOWN ""

# ── Logging ──────────────────────────────────────────────────────────────────
loglevel notice
